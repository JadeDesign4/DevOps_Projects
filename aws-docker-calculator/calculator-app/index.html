<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <div class="display" id="display">0</div>
        <div class="buttons">
            <button class="gray" onclick="clearDisplay()">AC</button>
            <button class="gray">+/-</button>
            <button class="gray">%</button>
            <button class="orange" id="divide" onclick="setOperator('/')">÷</button>
            
            <button class="dark-gray" onclick="append('7')">7</button>
            <button class="dark-gray" onclick="append('8')">8</button>
            <button class="dark-gray" onclick="append('9')">9</button>
            <button class="orange" id="multiply" onclick="setOperator('*')">×</button>
            
            <button class="dark-gray" onclick="append('4')">4</button>
            <button class="dark-gray" onclick="append('5')">5</button>
            <button class="dark-gray" onclick="append('6')">6</button>
            <button class="orange" id="subtract" onclick="setOperator('-')">-</button>
            
            <button class="dark-gray" onclick="append('1')">1</button>
            <button class="dark-gray" onclick="append('2')">2</button>
            <button class="dark-gray" onclick="append('3')">3</button>
            <button class="orange" id="add" onclick="setOperator('+')">+</button>
            
            <button class="dark-gray zero" onclick="append('0')">0</button>
            <button class="dark-gray" onclick="append('.')">.</button>
            <button class="orange" onclick="calculate()">=</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
